global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: triage-agent
    static_configs: [{targets: ["triage-agent:9100"]}]
  - job_name: agent-worker           # every replica of the scaled service: Docker DNS returns one A record per container
    dns_sd_configs:
      - names: ["agent-worker"]
        type: A
        port: 9100
        refresh_interval: 5s
  - job_name: retrieval
    static_configs: [{targets: ["retrieval:8100"]}]
  - job_name: llm-stub
    static_configs: [{targets: ["llm-stub:8200"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
